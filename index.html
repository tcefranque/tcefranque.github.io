<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Meu Website Pessoal</title>
    <style>
        /* Estilos básicos para deixar o site bonito */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .cartao {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
        }
        .botao {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .botao:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h1>Olá, Mundo! 👋</h1>
        <p>Bem-vindo ao meu novo website hospedado no GitHub Pages. Este é o início do meu projeto feito totalmente do zero!</p>
        <a href="#" class="botao">Saber Mais</a>
    </div>

</body>
</html>
